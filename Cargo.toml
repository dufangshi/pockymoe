[workspace]
members = [
  "crates/protocol",
  "crates/runtime",
  "crates/supervisor",
  "crates/relay",
  "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.12.93"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
hostname = "0.4"
http-body-util = "0.1"
portable-pty = "0.9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pockymoe-protocol = { path = "crates/protocol" }
pockymoe-relay = { path = "crates/relay" }
pockymoe-runtime = { path = "crates/runtime" }
pockymoe-supervisor = { path = "crates/supervisor" }
rusqlite = { version = "0.32", features = ["backup", "bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
which = "7"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
