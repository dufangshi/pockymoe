name: PR checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.89.0

jobs:
  changes:
    name: Select relevant checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      npm: ${{ steps.filter.outputs.npm }}
      workflows: ${{ steps.filter.outputs.workflows }}
      windows_harness: ${{ steps.filter.outputs.windows_harness }}
      thread_contract: ${{ steps.filter.outputs.thread_contract }}
      treer_packaging: ${{ steps.filter.outputs.treer_packaging }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'rustfmt.toml'
              - '.rustfmt.toml'
              - 'crates/**'
              - 'migrations/**'
            web:
              - 'apps/supervisor-web/**'
              - 'themes/**'
              - 'packages/shared/**'
              - 'packages/plugin-*/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            npm:
              - 'npm/**'
              - 'scripts/*.mjs'
              - 'scripts/setup.sh'
              - 'scripts/*.py'
              - 'package.json'
            workflows:
              - '.github/workflows/**'
            windows_harness:
              - 'crates/runtime/src/acp/rpc.rs'
              - 'crates/runtime/src/acp/dependencies.rs'
              - 'crates/runtime/src/management.rs'
            thread_contract:
              - 'crates/protocol/**'
              - 'packages/shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            treer_packaging:
              - 'integrations/treer/**'
              - '.github/workflows/ci.yml'

  treer_packaging:
    name: Treer setup bundle and offline tests
    needs: changes
    if: needs.changes.outputs.treer_packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check bundle and setup behavior
        run: |
          sh -n integrations/treer/setup.sh
          sh -n integrations/treer/treer-setup.sh
          python3 integrations/treer/bundle_setup.py --check
          python3 -m unittest discover -s integrations/treer -p 'test_*.py' -v

  thread_contract:
    name: Rust/TS thread schema contract
    needs: changes
    if: needs.changes.outputs.thread_contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Test protocol wire and shared discriminants
        run: cargo +"${RUST_VERSION}" test -p pockymoe-protocol --locked

  windows_harness:
    name: Windows harness command regression
    needs: changes
    if: needs.changes.outputs.windows_harness == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install $env:RUST_VERSION --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Test batch spawning and update diagnostics only
        run: cargo +$env:RUST_VERSION test -p pockymoe-runtime --lib windows_ --locked

  workflows:
    name: Workflow syntax
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Lint GitHub Actions workflows
        # Keep shell warnings/errors; style and informational suggestions are
        # not a merge gate for unrelated deployment scripts.
        run: docker run --rm -e SHELLCHECK_OPTS=--severity=warning -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  rust:
    name: Rust check (Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting and compilation
        run: |
          cargo +"${RUST_VERSION}" fmt --all --check
          cargo +"${RUST_VERSION}" check --workspace --locked

  node:
    name: Relevant TypeScript packages
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      # A same-named thread UI branch carries changes that must land together.
      - name: Check out thread UI dependency
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          repo=https://github.com/dufangshi/pockymoe-thread-ui-rust.git
          ref=main
          if git ls-remote --exit-code --heads "${repo}" "${BRANCH}" >/dev/null; then ref="${BRANCH}"; fi
          git clone --depth 1 --branch "${ref}" "${repo}" ./pockymoe-thread-ui
      - name: Install thread UI dependencies
        run: pnpm --dir ./pockymoe-thread-ui install --frozen-lockfile
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test Web
        run: |
          pnpm --dir ./pockymoe-thread-ui --filter @pockymoe/thread-ui build
          pnpm --filter @pockymoe/supervisor-web typecheck
          pnpm --filter @pockymoe/supervisor-web test

  npm:
    name: npm launcher and updater unit tests
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test npm scripts without building or installing the product
        run: node --test scripts/publish-npm-release.test.mjs scripts/npm-launcher-download.test.mjs scripts/npm-launcher-relay.test.mjs scripts/supervisor-update.test.mjs
      - name: Check setup and real systemd unit parsing without starting services
        env:
          POCKYMOE_TEST_SYSTEMD: '1'
        run: |
          node --test scripts/setup.test.mjs scripts/native-setup.test.mjs
          python3 scripts/prepare-runtime-release.test.py

  result:
    name: PR checks complete
    needs: [changes, workflows, rust, node, npm, windows_harness, thread_contract, treer_packaging]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected checks to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*) exit 1 ;;
          esac
