name: GitHub native runtime release

on:
  workflow_dispatch:
    inputs:
      thread_ui_sha:
        description: Full commit SHA from remote-codex-thread-ui-rust to release
        required: true
        type: string
      channel:
        description: Verify artifacts only, or publish a stable GitHub Release
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - latest

permissions:
  contents: read

concurrency:
  group: native-runtime-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.89.0
  THREAD_UI_REPO: https://github.com/dufangshi/pockymoe-thread-ui-rust.git

jobs:
  verify:
    name: Release test gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A version with database migrations may not drop already-published code.
      - name: Refuse releases that drop already-published commits
        if: inputs.channel != 'dry-run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '[.[] | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')"
          test -n "${latest}"
          git fetch --force origin "refs/tags/${latest}:refs/tags/${latest}"
          if ! git merge-base --is-ancestor "${latest}" HEAD; then
            echo "::error::HEAD does not contain ${latest}, the current GitHub runtime release. Merge it before releasing."
            exit 1
          fi

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-test
          cmd-format: rustup run ${{ env.RUST_VERSION }} {0}

      - name: Test workspace and migrations
        run: cargo +${{ env.RUST_VERSION }} test --workspace --locked

  native:
    name: Native ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            cargo_target: aarch64-apple-darwin
            binary: pockymoe
            runnable: true
            linux: false
          - key: linux-arm64-gnu
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu.2.28
            cargo_target: aarch64-unknown-linux-gnu
            binary: pockymoe
            runnable: false
            linux: true
          - key: linux-x64-gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu.2.28
            cargo_target: x86_64-unknown-linux-gnu
            binary: pockymoe
            runnable: true
            linux: true
          - key: win32-x64-msvc
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            cargo_target: x86_64-pc-windows-msvc
            binary: pockymoe.exe
            runnable: true
            linux: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target '${{ matrix.cargo_target }}'

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-${{ matrix.key }}-${{ matrix.target }}-zigbuild-0.23.4-macos-12.0
          cmd-format: rustup run ${{ env.RUST_VERSION }} {0}

      - name: Install Linux Zig linker
        if: matrix.linux
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install cargo-zigbuild
        if: matrix.linux
        shell: bash
        run: python -m pip install 'cargo-zigbuild==0.23.4'

      - name: Validate native PowerShell setup syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/setup.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }

      - name: Select native Perl for vendored OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perlPath = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perlPath)) { throw 'The runner is missing native Strawberry Perl' }
          & $perlPath -MIPC::Cmd -e 1
          if ($LASTEXITCODE -ne 0) { throw 'Native Perl cannot load OpenSSL build dependencies' }
          "OPENSSL_SRC_PERL=$perlPath" >> $env:GITHUB_ENV

      - name: Build native executable
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          set -euo pipefail
          if [ '${{ matrix.linux }}' = 'true' ]; then
            cargo +"${RUST_VERSION}" zigbuild --locked --release --package pockymoe --target '${{ matrix.target }}'
          else
            cargo +"${RUST_VERSION}" build --locked --release --package pockymoe --target '${{ matrix.target }}'
          fi

      - name: Verify Windows detached workers survive normal stderr and stop correctly
        if: runner.os == 'Windows'
        shell: bash
        run: cargo +"${RUST_VERSION}" test --locked --release --lib --package pockymoe-supervisor --target '${{ matrix.cargo_target }}' distribution::service::tests::windows_native_stderr_survives -- --exact

      - name: Smoke native executable
        if: matrix.runnable
        shell: bash
        run: target/'${{ matrix.cargo_target }}'/release/'${{ matrix.binary }}' version

      - name: Verify independent native restart without npm or model requests
        if: matrix.key == 'linux-x64-gnu'
        shell: bash
        run: python3 scripts/test-native-update.py --binary target/${{ matrix.cargo_target }}/release/${{ matrix.binary }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'artifacts/${{ matrix.key }}'
          cp 'target/${{ matrix.cargo_target }}/release/${{ matrix.binary }}' 'artifacts/${{ matrix.key }}/${{ matrix.binary }}'
          if [ '${{ runner.os }}' != 'Windows' ]; then
            chmod 0755 'artifacts/${{ matrix.key }}/${{ matrix.binary }}'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: artifacts/${{ matrix.key }}/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  web:
    name: Build Web assets
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Check out thread UI
        shell: bash
        env:
          THREAD_UI_SHA: ${{ inputs.thread_ui_sha }}
        run: |
          set -euo pipefail
          [[ "${THREAD_UI_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full UI commit SHA is required' >&2; exit 1; }
          git init ./pockymoe-thread-ui
          git -C ./pockymoe-thread-ui remote add origin "${THREAD_UI_REPO}"
          git -C ./pockymoe-thread-ui fetch --depth 1 origin "${THREAD_UI_SHA}"
          git -C ./pockymoe-thread-ui checkout --detach FETCH_HEAD
          test "$(git -C ./pockymoe-thread-ui rev-parse HEAD)" = "${THREAD_UI_SHA}"
          echo "Thread UI: ${THREAD_UI_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build pinned Web assets for the native runtime
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir ./pockymoe-thread-ui install --frozen-lockfile
          pnpm --dir ./pockymoe-thread-ui --filter @pockymoe/thread-ui build
          pnpm install --frozen-lockfile
          pnpm --filter @pockymoe/supervisor-web build

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/supervisor-web/dist/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Assemble complete native release
    needs: [verify, native, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: artifacts/web
      - uses: actions/download-artifact@v4
        with:
          pattern: '{darwin-arm64,linux-arm64-gnu,linux-x64-gnu,win32-x64-msvc}'
          path: artifacts/native
      - name: Assemble versioned binaries, Web and checksums
        run: python3 scripts/prepare-runtime-release.py --artifacts-dir artifacts/native --web-dir artifacts/web --out release-assets
      - name: Verify native bootstrap regressions
        run: |
          sh -n scripts/setup.sh
          node --test scripts/native-setup.test.mjs
          python3 scripts/prepare-runtime-release.test.py
      - uses: actions/upload-artifact@v4
        with:
          name: pockymoe-runtime-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  release:
    if: inputs.channel == 'latest'
    name: Publish immutable GitHub runtime release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: pockymoe-runtime-${{ github.sha }}
          path: release-assets
      - name: Create or verify immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat release-assets/runtime-version.txt)"
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            target=$(gh release view "${tag}" --json targetCommitish --jq .targetCommitish)
            test "${target}" = "${GITHUB_SHA}" || {
              echo "Release ${tag} targets ${target}, expected ${GITHUB_SHA}" >&2
              exit 1
            }
            mkdir existing-assets
            gh release download "${tag}" --dir existing-assets
            for asset in release-assets/*; do
              cmp "${asset}" "existing-assets/$(basename "${asset}")"
            done
            gh release edit "${tag}" --latest
          else
            gh release create "${tag}" release-assets/* \
              --target "${GITHUB_SHA}" --latest \
              --title "Pockymoe ${version}" \
              --notes-file docs/runtime-release-notes.md
          fi
