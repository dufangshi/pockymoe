name: Full compatibility (manual)

on:
  # Agents dispatch this only when the user explicitly requests full validation.
  workflow_dispatch:
    inputs:
      validation:
        type: choice
        default: full
        options: [full]
        description: Explicit full compatibility validation
  workflow_call:

permissions:
  contents: read

concurrency:
  group: platform-compatibility-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.89.0
  THREAD_UI_REPO: https://github.com/dufangshi/pockymoe-thread-ui-rust.git
  THREAD_UI_REF: main

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo +${{ env.RUST_VERSION }} fmt --all --check

      - name: Test workspace
        run: cargo +${{ env.RUST_VERSION }} test --workspace --locked

      - name: Clippy workspace
        if: runner.os == 'Linux'
        run: cargo +${{ env.RUST_VERSION }} clippy --workspace --all-targets --locked

  windows-manager:
    name: Windows Device Manager
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-device-manager
          cache-on-failure: true

      - name: Build and verify Device Manager
        shell: pwsh
        run: ./scripts/windows/build-device-manager.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-device-manager-${{ github.sha }}
          path: artifacts/windows-device-manager/win-x64/
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web and native runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6


      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Check out thread UI
        shell: bash
        run: |
          set -euo pipefail
          ref="${THREAD_UI_REF}"
          # A same-named thread UI branch carries changes that must land together.
          if git ls-remote --exit-code --heads "${THREAD_UI_REPO}" "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" >/dev/null; then ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"; fi
          git clone --depth 1 --branch "${ref}" "${THREAD_UI_REPO}" ./pockymoe-thread-ui
          echo "Thread UI: $(git -C ./pockymoe-thread-ui rev-parse HEAD)" >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pockymoe-thread-ui/pnpm-lock.yaml
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir ./pockymoe-thread-ui install --frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Build thread UI before supervisor validation
        run: pnpm --dir ./pockymoe-thread-ui --filter @pockymoe/thread-ui build

      - name: Typecheck and test Web
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @pockymoe/supervisor-web typecheck
          pnpm --filter @pockymoe/supervisor-web test
          pnpm --filter @pockymoe/supervisor-web build

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          cargo +"${RUST_VERSION}" build --locked --release --package pockymoe

      - name: Verify native bootstrap
        run: node --test scripts/native-setup.test.mjs
