name: Web Pages Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/supervisor-web/**'
      - 'packages/**'
      - 'thread-ui.sha'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'scripts/setup.sh'
      - 'scripts/setup.ps1'
      - 'scripts/check-static-web.mjs'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_POCKYMOE_RELAY_ORIGIN: ${{ vars.POCKYMOE_RELAY_ORIGIN }}
      POCKYMOE_WEB_DOMAIN: app.lnz-study.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read shared UI pin and validate relay configuration
        id: ui
        shell: bash
        run: |
          set -euo pipefail
          ui_sha="$(cat thread-ui.sha)"
          [[ "${ui_sha}" =~ ^[0-9a-f]{40}$ ]]
          test -n "${VITE_POCKYMOE_RELAY_ORIGIN}"
          echo "sha=${ui_sha}" >> "${GITHUB_OUTPUT}"
      - name: Check out pinned shared UI
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dufangshi/pockymoe-thread-ui-rust
          ref: ${{ steps.ui.outputs.sha }}
          path: pockymoe-thread-ui
          fetch-depth: 0
          persist-credentials: false
      - name: Verify shared UI checkout
        env:
          THREAD_UI_SHA: ${{ steps.ui.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pockymoe-thread-ui rev-parse HEAD)" = "${THREAD_UI_SHA}"
          git -C pockymoe-thread-ui fetch --no-tags origin main:refs/remotes/origin/main
          git -C pockymoe-thread-ui merge-base --is-ancestor "${THREAD_UI_SHA}" origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pockymoe-thread-ui/pnpm-lock.yaml
      - name: Build and validate static Web
        run: |
          pnpm --dir pockymoe-thread-ui install --frozen-lockfile
          pnpm --dir pockymoe-thread-ui --filter @pockymoe/thread-ui build
          pnpm --filter @pockymoe/supervisor-web... install --frozen-lockfile
          pnpm --filter @pockymoe/supervisor-web build:static
          node scripts/check-static-web.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/supervisor-web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static Web
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
