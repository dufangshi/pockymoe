[package]
name = "pockymoe-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
hostname.workspace = true
hex.workspace = true
sha2.workspace = true
pockymoe-protocol.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
shell-words.workspace = true
similar = "2.7"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml = "0.8"
toml_edit = "0.22"
tracing.workspace = true
url.workspace = true
uuid.workspace = true
walkdir.workspace = true
which.workspace = true
zip.workspace = true
tempfile = "3"
sysinfo = { version = "=0.36.1", default-features = false, features = ["system", "component"] }
csv = "1"
plist = "=1.7.0"
# Decoders for chat-photo thumbnails plus the JPEG/PNG encoders; no rayon, no
# AVIF/TIFF/EXR, no native libraries.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
