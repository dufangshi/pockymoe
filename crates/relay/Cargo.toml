[package]
name = "pockymoe-relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
hex = { workspace = true }
hmac = "0.12"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand.workspace = true
reqwest = { workspace = true, features = ["http2"] }
pockymoe-protocol.workspace = true
rusqlite = { workspace = true, features = ["backup"] }
scrypt = "0.11"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
totp-rs = { version = "5.7", features = ["otpauth", "gen_secret", "serde_support"] }
aes-gcm = "0.10"
hkdf = "0.12"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
qrcodegen = "1.8"
openssl = { version = "0.10.81", features = ["vendored"] }
web-push = { version = "0.11.0", default-features = false }

[target.'cfg(unix)'.dependencies]
# statvfs for the disk holding the data directory and the clock tick rate for
# process CPU time (admin Server section); already in the build through tempfile.
rustix = { version = "1", features = ["fs", "param"] }

[dev-dependencies]
ece = "2.3.1"
tokio-tungstenite.workspace = true
