<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Paint the last theme before the app loads, not white and then the dark
      // default. src/app.tsx keeps `pockymoe.paint` up to date.
      (function () {
        try {
          var root = document.documentElement;
          var paint = JSON.parse(localStorage.getItem('pockymoe.paint') || 'null') || {};
          var mode = localStorage.getItem('remote-codex-theme-mode');
          var effective = paint.fixed ? paint.effective
            : mode === 'light' || mode === 'dark' ? mode
            : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          root.setAttribute('data-theme-effective', effective);
          root.style.colorScheme = effective;
          root.style.backgroundColor = paint.effective === effective && paint.background
            ? paint.background : effective === 'light' ? '#f4f6f3' : '#111416';
        } catch (error) { /* Storage blocked: the app paints on load. */ }
      })();
    </script>
    <base href="/" data-pockymoe-base />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#171713" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=pockymoe" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=pockymoe" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=pockymoe" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=pockymoe" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Pockymoe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
