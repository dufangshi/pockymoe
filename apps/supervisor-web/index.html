<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" data-pockymoe-base />
    <script src="/theme-paint.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#171713" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=pockymoe" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=pockymoe" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=pockymoe" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=pockymoe" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Pockymoe</title>
  </head>
  <body>
    <!-- Shown until the app renders: the scripts are megabytes, and a phone on a
         slow link otherwise shows an empty dark page for seconds. Styles are
         inline (the site's policy allows them; it allows no inline script). -->
    <div id="root"><div id="boot" role="status" aria-live="polite" aria-label="Loading Pockymoe">
      <style>
        #boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; font: 600 15px/1 system-ui, sans-serif; letter-spacing: .02em; color: #9aa39a; }
        [data-theme-effective='light'] #boot { color: #5d665e; }
        #boot i { display: block; width: 132px; height: 3px; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, currentColor 22%, transparent); }
        #boot i::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 2px; background: currentColor; animation: boot-slide 1.1s ease-in-out infinite; }
        @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) { #boot i::after { animation: none; width: 100%; opacity: .5; } }
      </style>
      <span>Pockymoe</span><i></i>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
